name: FUTMAC Production Health

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futmac-production-health
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kodu al
        uses: actions/checkout@v7
      - name: Node.js hazırla
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Canlı site ve backend kontrolü
        env:
          FUTMAC_SITE_URL: https://futmac.com.tr/
        run: node scripts/futmac-production-smoke.mjs
